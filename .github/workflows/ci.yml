name: CI
run-name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  workflow-lint:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","homelab-map-always-on"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install and run actionlint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64; checksum=cd3dfe5f66887ec6b987752d8d9614e59fd22f39415c5ad9f28374623f41773a ;;
            X64) arch=amd64; checksum=f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f ;;
            *) echo "Unsupported architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          tools_dir="$RUNNER_TEMP/actionlint-tools"
          mkdir -p "$tools_dir"
          curl -fsSL --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_${arch}.tar.gz" \
            -o "$tools_dir/actionlint.tar.gz"
          echo "$checksum  $tools_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tools_dir/actionlint.tar.gz" -C "$tools_dir"
          "$tools_dir/actionlint" -color

  backend-tests:
    needs: workflow-lint
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","homelab-map-always-on"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r aggregator/requirements.txt

      - name: Run backend test suite
        working-directory: aggregator
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

  frontend-tests:
    needs: workflow-lint
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","ARM64","homelab-map-always-on"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: bun run lint || (echo "Linting failed. Run 'bun run lint' locally to see errors." && exit 1)

      - name: Type check frontend
        working-directory: frontend
        run: bun run type-check

      - name: Build frontend (verify build succeeds)
        working-directory: frontend
        run: bun run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false

      - name: Run frontend test suite
        working-directory: frontend
        run: bun run test -- --watchAll=false --coverage=false --verbose 2>&1 || (echo "Test failed, checking output..." && exit 1)
